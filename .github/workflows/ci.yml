name: CI
on: [push, pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:16
    env:
     POSTGRES_PASSWORD: postgres
     POSTGRES_DB: securequote_test
    ports: ["5432:5432"]
    options: >-
     --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
  env:
   TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/securequote_test
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with:
      python-version: "3.12"
   - run: pip install -r requirements.txt
   - run: python -m unittest discover -s applications/securequote_lite/tests -v
   - run: python -m unittest discover -s tests -v
   - run: python -m compileall -q applications src api tests
